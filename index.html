<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บัญชี POPLUCK</title>
<meta name="theme-color" content="#101828">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('poplk-acc-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ ล็อกอิน ============ -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="login-logo">พ</div>
    <h1>โปรแกรมบัญชี</h1>
    <p class="sub">บริษัท พบลักษณ์ สกินแคร์ (ประเทศไทย) จำกัด</p>
    <label for="lgEmail">อีเมล</label>
    <input id="lgEmail" type="email" autocomplete="username" required>
    <label for="lgPass">รหัสผ่าน</label>
    <input id="lgPass" type="password" autocomplete="current-password" required>
    <button type="submit" id="lgBtn">เข้าสู่ระบบ</button>
    <div id="loginErr"></div>
  </form>
</div>

<!-- ============ โปรแกรม ============ -->
<div id="app" class="hide">
  <aside id="side">
    <div class="brand">
      <div class="mark">พ</div>
      <div>
        <div class="t1">POPLUCK</div>
        <div class="t2">ระบบบัญชี</div>
      </div>
    </div>
    <nav id="nav">
      <div class="nav-label">ภาพรวม</div>
      <button class="nav-item on" data-page="dash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        แดชบอร์ด</button>
      <div class="nav-label">รายการเงิน</div>
      <button class="nav-item" data-page="income">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        รายรับ</button>
      <button class="nav-item" data-page="expense">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        รายจ่าย</button>
      <div class="nav-label">ภาษี</div>
      <button class="nav-item" data-page="wht">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/></svg>
        หัก ณ ที่จ่าย</button>
      <button class="nav-item" data-page="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        ปฏิทินภาษี</button>
      <div class="nav-label">ทรัพย์สินและรายงาน</div>
      <button class="nav-item" data-page="assets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>
        ทรัพย์สิน</button>
      <button class="nav-item" data-page="reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
        รายงาน</button>
      <div class="nav-label">ตั้งค่า</div>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        ตั้งค่า</button>
    </nav>
    <div class="nav-foot">
      <button id="logout">ออกจากระบบ</button>
    </div>
  </aside>

  <main>
    <header>
      <button class="menu-btn" id="menuBtn" aria-label="เมนู">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="pageTitle">แดชบอร์ด</h1>
      <button class="icon-btn no-print" id="themeBtn" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <div class="period">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <select id="periodSel"></select>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalHost"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
